<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>色阶，而不是默认色板</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1c1915;
    --muted: #6d655c;
    --line: #e4dcd0;
    --paper: #f6f1e8;
    --card: #fffdf9;
    --bad: #9a3b2f;
    --good: #2f6a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 8% -10%, #efe2cc 0%, transparent 60%),
      var(--paper);
    font-family: "IBM Plex Sans", "PingFang SC", sans-serif;
    line-height: 1.45;
  }
  header, main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
  header { padding: 36px 0 8px; }
  h1 {
    margin: 0 0 8px;
    font-family: Fraunces, "Songti SC", serif;
    font-weight: 560;
    font-size: 40px;
    letter-spacing: -0.03em;
  }
  header p { margin: 0; max-width: 68ch; color: var(--muted); }
  .board {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 16px;
    margin: 22px 0 28px;
  }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
  }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .tag {
    display: inline-block;
    margin-bottom: 8px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tag.bad { color: var(--bad); }
  .tag.good { color: var(--good); }
  .note { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .palette { display: grid; gap: 8px; }
  .family { display: grid; grid-template-columns: 72px 1fr; gap: 8px; align-items: center; }
  .family span { font-size: 12px; color: var(--muted); }
  .steps { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
  button.swatch, button.step {
    border: 0;
    height: 28px;
    padding: 0;
    cursor: pointer;
    border-radius: 4px;
  }
  button.swatch.picked, button.step.bound { outline: 2px solid var(--ink); outline-offset: 2px; }
  .picked-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; margin-top: 12px; }
  .chip {
    font-size: 12px;
    border-radius: 999px;
    padding: 4px 8px;
    background: #f3ece2;
  }
  .ladders { display: grid; gap: 12px; }
  .ladder-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ladder-head strong { font-size: 14px; }
  .choices { display: flex; gap: 6px; flex-wrap: wrap; }
  .choices button, .roles button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
  }
  .choices button.on, .roles button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin-top: 6px; }
  .step-label { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
  .roles { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 8px; }
  .bind-hint { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .preview {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 12px;
    margin-top: 14px;
    padding: 12px;
    border-radius: 14px;
    background: #f7f3ec;
  }
  .card {
    border-radius: 12px;
    padding: 14px;
    border: 1px solid transparent;
  }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0 0 10px; font-size: 13px; }
  .card button {
    border: 0;
    border-radius: 8px;
    padding: 7px 10px;
    font: inherit;
    font-size: 13px;
  }
  .verdict { font-size: 13px; }
  .verdict code { font-size: 12px; }
  .ok { color: var(--good); }
  .no { color: var(--bad); }
  footer { width: min(1180px, calc(100% - 40px)); margin: 0 auto 40px; color: var(--muted); font-size: 13px; }
  @media (max-width: 860px) {
    .board, .preview { grid-template-columns: 1fr; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<header>
  <h1>色阶，而不是默认色板</h1>
  <p>左边是在 Tailwind 默认色里临时点选。右边是先选定几条完整色阶，再把 primary、border 这类语义色绑到某一档。点右边色块即可改绑定。</p>
</header>
<main class="board">
  <section>
    <div class="tag bad">不采用</div>
    <h2>从默认色板里找</h2>
    <p class="note">每点一下就批准一个 Tailwind 原名。页面上会同时出现互不相关的颜色，而且 bg-red-500 不再报错。</p>
    <div class="palette" id="raw"></div>
    <div class="picked-list" id="raw-picked"></div>
  </section>
  <section>
    <div class="tag good">起步方式</div>
    <h2>选完整色阶，再绑定语义色</h2>
    <p class="note">用户只选中性色家族，或给一个品牌色。状态色先用预置。主题里写 brand-500，不写 red-500。</p>
    <div class="ladders" id="ladders"></div>
    <div class="roles" id="roles"></div>
    <p class="bind-hint" id="bind-hint"></p>
    <div class="scale" id="bind-scale"></div>
    <div class="preview">
      <div class="card" id="mini">
        <h3>通知</h3>
        <p id="mini-copy">主色来自品牌色阶，边框来自中性色阶。</p>
        <button id="mini-btn" type="button">查看</button>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  </section>
</main>
<footer>这是交互说明页，颜色值为演示用近似值。点选不会写入真实主题文件。</footer>
<script>
const STEPS = [50,100,200,300,400,500,600,700,800,900,950];
const RAW = {
  red: ["#fef2f2","#fee2e2","#fecaca","#fca5a5","#f87171","#ef4444","#dc2626","#b91c1c","#991b1b","#7f1d1d","#450a0a"],
  blue: ["#eff6ff","#dbeafe","#bfdbfe","#93c5fd","#60a5fa","#3b82f6","#2563eb","#1d4ed8","#1e40af","#1e3a8a","#172554"],
  amber: ["#fffbeb","#fef3c7","#fde68a","#fcd34d","#fbbf24","#f59e0b","#d97706","#b45309","#92400e","#78350f","#451a03"],
  zinc: ["#fafafa","#f4f4f5","#e4e4e7","#d4d4d8","#a1a1aa","#71717a","#52525b","#3f3f46","#27272a","#18181b","#09090b"]
};
const NEUTRALS = {
  stone: ["#fafaf9","#f5f5f4","#e7e5e4","#d6d3d1","#a8a29e","#78716c","#57534e","#44403c","#292524","#1c1917","#0c0a09"],
  zinc: RAW.zinc,
  slate: ["#f8fafc","#f1f5f9","#e2e8f0","#cbd5e1","#94a3b8","#64748b","#475569","#334155","#1e293b","#0f172a","#020617"]
};
const BRANDS = {
  teal: ["#f0fdfa","#ccfbf1","#99f6e4","#5eead4","#2dd4bf","#14b8a6","#0d9488","#0f766e","#115e59","#134e4a","#042f2e"],
  clay: ["#fdf6f0","#f8e6d8","#f0c9ae","#e4a67e","#d58455","#c2663a","#a6502e","#864028","#6b3424","#4a2419","#2a130d"],
  ink: ["#f4f7fb","#e5edf6","#c9d8ea","#9db6d4","#6d90b8","#466892","#345277","#2b415d","#243348","#182230","#0d1218"]
};
const STATUS = {
  success: ["#f0fdf4","#dcfce7","#bbf7d0","#86efac","#4ade80","#22c55e","#16a34a","#15803d","#166534","#14532d","#052e16"],
  warning: RAW.amber,
  danger: RAW.red
};
const ROLES = [
  { id: "primary", label: "primary", ladder: "brand", step: 600, fg: "#fffdf9" },
  { id: "border", label: "border", ladder: "neutral", step: 200, fg: "#1c1915" },
  { id: "destructive", label: "destructive", ladder: "danger", step: 600, fg: "#fffdf9" }
];
const rawPicked = new Set();
let neutral = "stone";
let brand = "teal";
let activeRole = "primary";

function ladder(name) {
  if (name === "neutral") return NEUTRALS[neutral];
  if (name === "brand") return BRANDS[brand];
  return STATUS[name];
}
function colorAt(name, step) {
  return ladder(name)[STEPS.indexOf(step)];
}
function contrast(hex) {
  const n = parseInt(hex.slice(1), 16);
  const y = ((n >> 16) & 255) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11;
  return y > 150 ? "#1c1915" : "#fffdf9";
}

function renderRaw() {
  document.getElementById("raw").innerHTML = Object.entries(RAW).map(([name, colors]) => `
    <div class="family">
      <span>${name}</span>
      <div class="steps">
        ${colors.map((color, i) => `<button class="swatch ${rawPicked.has(name + "-" + STEPS[i]) ? "picked" : ""}" style="background:${color}" data-name="${name}-${STEPS[i]}" title="${name}-${STEPS[i]}"></button>`).join("")}
      </div>
    </div>`).join("");
  document.getElementById("raw-picked").innerHTML = rawPicked.size
    ? [...rawPicked].map((name) => `<span class="chip">bg-${name} 已批准</span>`).join("")
    : `<span class="chip">还没点选。点一个色块，就等于把这个默认色写进主题。</span>`;
}

function renderLadders() {
  const rows = [
    ["neutral", "中性色", NEUTRALS, neutral],
    ["brand", "品牌色", BRANDS, brand]
  ];
  document.getElementById("ladders").innerHTML = rows.map(([key, label, options, current]) => `
    <div>
      <div class="ladder-head"><strong>${label}</strong>
        <div class="choices">${Object.keys(options).map((name) => `<button type="button" data-kind="${key}" data-value="${name}" class="${name === current ? "on" : ""}">${name}</button>`).join("")}</div>
      </div>
      <div class="scale">${options[current].map((color, i) => `<div><div class="swatch" style="height:28px;border-radius:4px;background:${color}"></div><div class="step-label">${STEPS[i]}</div></div>`).join("")}</div>
    </div>`).join("") + `
    <div>
      <div class="ladder-head"><strong>状态色，预置</strong><span class="note" style="margin:0">success / warning / danger</span></div>
      <div class="scale">${STATUS.success.map((_, i) => `<div><div class="swatch" style="height:28px;border-radius:4px;background:linear-gradient(${STATUS.success[i]} 0 33%, ${STATUS.warning[i]} 33% 66%, ${STATUS.danger[i]} 66%)"></div><div class="step-label">${STEPS[i]}</div></div>`).join("")}</div>
    </div>`;
}

function renderBind() {
  const role = ROLES.find((item) => item.id === activeRole);
  document.getElementById("roles").innerHTML = ROLES.map((item) => `<button type="button" data-role="${item.id}" class="${item.id === activeRole ? "on" : ""}">${item.label} → ${item.ladder}-${item.step}</button>`).join("");
  document.getElementById("bind-hint").textContent = `正在改 ${role.label}。点下面一档，它就指向 ${role.ladder} 的该档。`;
  document.getElementById("bind-scale").innerHTML = STEPS.map((step, i) => {
    const color = colorAt(role.ladder, step);
    return `<button class="step ${role.step === step ? "bound" : ""}" style="background:${color}" data-step="${step}" title="${role.ladder}-${step}"></button>`;
  }).join("");
  const primary = ROLES[0], border = ROLES[1], danger = ROLES[2];
  const card = document.getElementById("mini");
  card.style.background = "#fffdf9";
  card.style.borderColor = colorAt(border.ladder, border.step);
  card.style.color = "#1c1915";
  const button = document.getElementById("mini-btn");
  button.style.background = colorAt(primary.ladder, primary.step);
  button.style.color = contrast(colorAt(primary.ladder, primary.step));
  document.getElementById("verdict").innerHTML = `
    <p class="ok">合法：<code>bg-brand-${primary.step}</code>，因为品牌色阶整条都在主题里。</p>
    <p class="ok">合法：<code>border-neutral-${border.step}</code>，border 只是指向这一档。</p>
    <p class="ok">合法：<code>bg-danger-${danger.step}</code>，destructive 默认绑在这里。</p>
    <p class="no">仍报错：<code>bg-red-500</code>、<code>bg-zinc-200</code>。默认色原名没有写入主题。</p>`;
}

document.body.addEventListener("click", (event) => {
  const swatch = event.target.closest(".swatch[data-name]");
  if (swatch) {
    const name = swatch.dataset.name;
    rawPicked.has(name) ? rawPicked.delete(name) : rawPicked.add(name);
    renderRaw();
    return;
  }
  const choice = event.target.closest("[data-kind]");
  if (choice) {
    if (choice.dataset.kind === "neutral") neutral = choice.dataset.value;
    if (choice.dataset.kind === "brand") brand = choice.dataset.value;
    renderLadders();
    renderBind();
    return;
  }
  const role = event.target.closest("[data-role]");
  if (role) {
    activeRole = role.dataset.role;
    renderBind();
    return;
  }
  const step = event.target.closest("[data-step]");
  if (step) {
    ROLES.find((item) => item.id === activeRole).step = Number(step.dataset.step);
    renderBind();
  }
});

renderRaw();
renderLadders();
renderBind();
</script>
</body>
</html>
